name: Publication

# Poser un tag `v0.1.0` suffit à publier : le DMG est fabriqué, signé,
# notarisé et attaché à une Release portant ce tag. Le mode d'emploi des
# secrets et des certificats est dans outils/PUBLIER.md.
on:
  push:
    tags:
      - "v*"

permissions:
  # Créer la Release et y téléverser le DMG, rien de plus.
  contents: write

jobs:
  dmg:
    name: DMG pour macOS
    # macos-14 est le premier runner Apple Silicon : le DMG produit est arm64,
    # comme les Mac sur lesquels il sera installé.
    runs-on: macos-14

    env:
      # Tant que les secrets n'existent pas, la publication a lieu quand même,
      # avec un DMG signé ad hoc que macOS refusera d'ouvrir sans détour par
      # les réglages. Le jour où le certificat et la clé sont posés, les mêmes
      # étapes signent et notarisent sans qu'il y ait une ligne à changer.
      SIGNATURE_DISPONIBLE: ${{ secrets.CERTIFICAT_P12_BASE64 != '' && secrets.ASC_CLE_P8_BASE64 != '' }}

    steps:
      - name: Récupère le dépôt
        uses: actions/checkout@v4

      - name: Installe Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installe les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Contrôle que le tag et pyproject.toml disent la même version
        run: |
          set -euo pipefail
          DECLAREE=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "v$DECLAREE" != "$GITHUB_REF_NAME" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à la version v$DECLAREE de pyproject.toml." >&2
            exit 1
          fi

      - name: Vérifie le projet
        # `verifier.py` ouvre l'interface, ce qu'un runner sans session
        # graphique ne peut pas lui offrir. La plateforme Qt « offscreen »
        # peint dans un tampon plutôt qu'à l'écran : le scénario se déroule
        # en entier, icône de barre de menus comprise.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python verifier.py

      - name: Ouvre un trousseau temporaire et y importe le certificat
        if: env.SIGNATURE_DISPONIBLE == 'true'
        env:
          CERTIFICAT_P12_BASE64: ${{ secrets.CERTIFICAT_P12_BASE64 }}
          MOT_DE_PASSE_P12: ${{ secrets.MOT_DE_PASSE_P12 }}
        run: |
          set -euo pipefail
          TROUSSEAU="$RUNNER_TEMP/publication.keychain-db"
          MOT_DE_PASSE="$(uuidgen)"
          echo "TROUSSEAU=$TROUSSEAU" >> "$GITHUB_ENV"

          security create-keychain -p "$MOT_DE_PASSE" "$TROUSSEAU"
          # Un trousseau qui se reverrouille tout seul au bout de cinq minutes
          # ferait échouer une signature un peu longue.
          security set-keychain-settings -lut 3600 "$TROUSSEAU"
          security unlock-keychain -p "$MOT_DE_PASSE" "$TROUSSEAU"

          echo "$CERTIFICAT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificat.p12"
          security import "$RUNNER_TEMP/certificat.p12" -k "$TROUSSEAU" \
            -P "$MOT_DE_PASSE_P12" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificat.p12"

          # Sans cette autorisation, `codesign` réclamerait le mot de passe du
          # trousseau dans une boîte de dialogue. Il n'y a pas d'écran pour la
          # montrer, et le travail resterait bloqué jusqu'au délai d'attente.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$MOT_DE_PASSE" "$TROUSSEAU" > /dev/null

          # `codesign` ne cherche l'identité que dans les trousseaux de la
          # liste de recherche : le nôtre doit y entrer, devant les autres.
          security list-keychains -d user -s "$TROUSSEAU" \
            $(security list-keychains -d user | tr -d '"')

      - name: Écrit la clé App Store Connect
        if: env.SIGNATURE_DISPONIBLE == 'true'
        env:
          ASC_CLE_P8_BASE64: ${{ secrets.ASC_CLE_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ASC_CLE_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          chmod 600 "$RUNNER_TEMP/asc.p8"

      - name: Fabrique le DMG, le signe et le notarise
        if: env.SIGNATURE_DISPONIBLE == 'true'
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_CLE_P8: ${{ runner.temp }}/asc.p8
        run: python outils/creer_dmg.py --notariser

      - name: Fabrique le DMG, sans certificat
        # `creer_dmg.py` retombe de lui-même sur une signature ad hoc quand il
        # ne trouve aucune identité Developer ID.
        if: env.SIGNATURE_DISPONIBLE != 'true'
        run: python outils/creer_dmg.py

      - name: Détruit le trousseau temporaire
        # Même en cas d'échec plus haut : ni la clé privée du certificat ni la
        # clé d'API n'ont à survivre à l'exécution.
        if: always()
        run: |
          security delete-keychain "${TROUSSEAU:-}" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/asc.p8"

      - name: Rédige les notes de version
        # Un `heredoc` entre guillemets simples : le texte part tel quel, sans
        # que le shell aille chercher une variable derrière une apostrophe.
        run: |
          set -euo pipefail
          cat > notes.md <<'FIN'
          Utilitaire de barre de menus pour macOS, Apple Silicon.
          FIN
          if [ "$SIGNATURE_DISPONIBLE" != "true" ]; then
            cat >> notes.md <<'FIN'

          ### À la première ouverture

          Cette version n'est pas notarisée par Apple : macOS annoncera que
          l'application est endommagée. Elle ne l'est pas, il lui manque un
          tampon.

          1. Glissez KnowYourCode dans le dossier Applications.
          2. Double-cliquez, puis fermez le message de refus.
          3. Réglages Système → Confidentialité et sécurité, tout en bas :
             « Ouvrir quand même ».

          C'est à faire une seule fois.
          FIN
          fi
          cat >> notes.md <<'FIN'

          ### Ce qu'il faut savoir

          La fabrication des cartes passe par l'API Mistral : posez votre clé
          dans `~/.knowyourcode/cle_mistral`. Sans clé, l'application démarre
          quand même et pose des cartes factices, tirées du seul repérage.

          Tout le reste est local : le choix de la fonction, la correction,
          l'historique et la progression.
          FIN

      - name: Crée la Release et y attache le DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "KnowYourCode $GITHUB_REF_NAME" \
            --notes-file notes.md
